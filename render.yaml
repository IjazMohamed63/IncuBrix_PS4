services:
  - type: web
    name: incubrix-distribution-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: APP_ENV
        value: production
      - key: SIMULATION_MODE
        value: "true"
      - key: API_ACCESS_TOKEN
        value: incubrix_demo_reviewer_token_2026
      - key: WEBHOOK_SIGNING_SECRET
        value: whsec_prod_signing_key_32chars_long_placeholder
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///incubrix.db
      - key: REDIS_URL
        value: ""
      - key: S3_ENDPOINT
        value: ""
      - key: S3_ACCESS_KEY
        value: ""
      - key: S3_SECRET_KEY
        value: ""
