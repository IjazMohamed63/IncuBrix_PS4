key: stub
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: test_surface
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 200
      body_max_chars: 5000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 60
    per_seconds: 60
capabilities: [publish, status, delete, metrics, refresh_auth, build_assist_pack]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "503": PLATFORM_UNAVAILABLE
instance_param: base_url
