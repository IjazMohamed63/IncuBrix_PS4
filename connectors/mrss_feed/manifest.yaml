key: mrss_feed
version: 1.0.0
tier: feed
auth: none
surfaces:
  - key: feed_item
    content_types: [text, markdown, image, video, audio]
    spec:
      title_max_chars: 500
      body_max_chars: 100000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 100
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "400": VALIDATION_ERROR
  "404": NOT_FOUND
  "422": PLATFORM_CONTENT_REJECTED
  "500": PLATFORM_UNAVAILABLE
instance_param: base_url
