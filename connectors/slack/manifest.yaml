key: slack
version: 1.0.0
tier: bridge
auth: api_key
surfaces:
  - key: message
    content_types: [text, markdown, image]
    spec:
      title_max_chars: 300
      body_max_chars: 40000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 20
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "400": VALIDATION_ERROR
  "401": CONNECTION_AUTH_EXPIRED
  "403": PLATFORM_PERMISSION_DENIED
  "404": NOT_FOUND
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
  "502": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
instance_param: webhook_url
