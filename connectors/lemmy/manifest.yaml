key: lemmy
version: 1.0.0
tier: protocol
auth: bot_token
surfaces:
  - key: post
    content_types: [text, image, link]
    spec:
      title_max_chars: 100
      body_max_chars: 20000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
  "502": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
  "504": PLATFORM_UNAVAILABLE
instance_param: base_url
